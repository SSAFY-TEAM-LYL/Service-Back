services:
  mysql:
    image: mysql:8.4
    container_name: lyl-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: lyl
      MYSQL_USER: lyl
      MYSQL_PASSWORD: lyl1234
      MYSQL_ROOT_PASSWORD: root1234
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - lyl-mysql-data:/var/lib/mysql

volumes:
  lyl-mysql-data:
