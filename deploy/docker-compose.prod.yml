services:
  mysql:
    image: mysql:8.4
    container_name: lyl-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - lyl-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  problem-bank-proxy:
    image: ${FLYCTL_IMAGE:-flyio/flyctl:latest}
    container_name: lyl-problem-bank-proxy
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    entrypoint:
      - /flyctl
    command:
      - mpg
      - proxy
      - ${PROBLEM_BANK_CLUSTER_ID:-w867508gn9nr3pk4}
      - --bind-addr
      - 0.0.0.0
      - --local-port
      - "${PROBLEM_BANK_PROXY_PORT:-16380}"
    expose:
      - "${PROBLEM_BANK_PROXY_PORT:-16380}"

  backend:
    image: ${BACKEND_IMAGE}
    container_name: lyl-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      problem-bank-proxy:
        condition: service_started
    ports:
      - "8080:8080"
    env_file:
      - ${BACKEND_ENV_FILE:-.env}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&sslMode=DISABLED&allowPublicKeyRetrieval=true
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}

volumes:
  lyl-mysql-data:
