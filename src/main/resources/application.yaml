spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: LYL-Back
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - email
              - profile
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - profile_image
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lyl?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&sslMode=DISABLED&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-millis: 3600000
  oauth2:
    success-redirect-uri: ${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:5173/oauth/callback}
    failure-redirect-uri: ${OAUTH2_FAILURE_REDIRECT_URI:http://localhost:5173/login}
    code-expiration-seconds: 180
  problem-bank:
    enabled: ${PROBLEM_BANK_ENABLED:false}
    datasource:
      url: ${PROBLEM_BANK_DB_URL:}
      username: ${PROBLEM_BANK_DB_USERNAME:}
      password: ${PROBLEM_BANK_DB_PASSWORD:}
      driver-class-name: org.postgresql.Driver
  judge0:
    enabled: ${JUDGE0_ENABLED:false}
    base-url: ${JUDGE0_BASE_URL:}
    auth-header: ${JUDGE0_AUTH_HEADER:X-Auth-Token}
    auth-token: ${JUDGE0_AUTH_TOKEN:}
    request-timeout-seconds: ${JUDGE0_REQUEST_TIMEOUT_SECONDS:5}
    poll-batch-size: ${JUDGE0_POLL_BATCH_SIZE:20}
    poll-delay-millis: ${JUDGE0_POLL_DELAY_MILLIS:2000}
